services:
  app:
    build: .
    image: catatan-praktikum:local
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      DB_HOST: database
      DB_DATABASE: ${DB_DATABASE:?Isi DB_DATABASE di .env}
      DB_USERNAME: ${DB_USERNAME:?Isi DB_USERNAME di .env}
      DB_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di .env}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - frontend
      - backend

  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Isi DB_DATABASE di .env}
      MYSQL_USER: ${DB_USERNAME:?Isi DB_USERNAME di .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Isi MYSQL_ROOT_PASSWORD di .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysql -h 127.0.0.1 -u "$$MYSQL_USER" -p"$$MYSQL_PASSWORD"
          "$$MYSQL_DATABASE" -e 'SELECT 1 FROM notes LIMIT 1'
          >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - backend

networks:
  frontend:
  backend:
    internal: true

volumes:
  mysql_data: